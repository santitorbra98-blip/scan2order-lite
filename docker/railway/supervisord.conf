[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:queue-worker]
; Processes queued jobs (audit logs, analytics events, etc.).
; --sleep 3  : poll interval when queue is empty.
; --tries 3  : max attempts before a job is marked failed.
; --max-time : restart worker after 3600 s to reclaim memory.
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --quiet
autostart=true
autorestart=true
user=www-data
numprocs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
